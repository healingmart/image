name: Fix HealingMart Cloudflare flow WebP
on:
  push:
    paths:
      - ".github/workflows/fix-hm-cloudflare-flow.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify ImageMagick
        run: convert -version
      - name: Fix final flow card
        run: |
          convert github-actions-cloudflare-worker-auto-deploy-flow.webp \
            -fill "#fbfdff" -stroke "#0f9f6e" -strokewidth 3 -draw "roundrectangle 970,245 1150,420 24,24" \
            -fill "#0f9f6e" -stroke none -draw "roundrectangle 990,265 1034,309 12,12" \
            -font DejaVu-Sans-Bold -pointsize 19 -fill white -annotate +1001+295 "5" \
            -font DejaVu-Sans-Bold -pointsize 21 -fill "#111827" -annotate +990+350 "Cloudflare" \
            -font DejaVu-Sans-Bold -pointsize 21 -fill "#111827" -annotate +990+380 "Worker" \
            -font DejaVu-Sans -pointsize 17 -fill "#64748b" -annotate +990+408 "new deploy" \
            /tmp/fixed-flow.webp
          mv /tmp/fixed-flow.webp github-actions-cloudflare-worker-auto-deploy-flow.webp
      - name: Commit fixed flow WebP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-actions-cloudflare-worker-auto-deploy-flow.webp
          git diff --cached --quiet && exit 0
          git commit -m "Fix Cloudflare article flow image label"
          git push
