name: Generate Gemini 4 Argon article assets

on:
  push:
    paths:
      - '_tmp_generate_gemini_4_argon_assets.py'
      - '.github/workflows/tmp-gemini-4-argon-assets.yml'

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Generate WebP assets
        run: python _tmp_generate_gemini_4_argon_assets.py

      - name: Commit generated assets and remove temporary generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemini-4-argon-launch-20261014-hero.webp
          git add gemini-4-argon-launch-20261014-summary.webp
          git add gemini-4-argon-launch-20261014-compare.webp
          git add gemini-4-argon-launch-20261014-data.webp
          git rm _tmp_generate_gemini_4_argon_assets.py
          git rm .github/workflows/tmp-gemini-4-argon-assets.yml
          git commit -m "feat: add Gemini 4 Argon article WebP assets"
          git push origin HEAD:main
