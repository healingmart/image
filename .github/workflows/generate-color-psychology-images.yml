name: Generate color psychology images

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate_color_psychology_images.py"
      - ".github/workflows/generate-color-psychology-images.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pillow
      - name: Generate WebP assets
        run: python .github/scripts/generate_color_psychology_images.py
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add color-psychology-20261020-hero.webp \
                  color-psychology-20261020-summary.webp \
                  color-psychology-20261020-context.webp \
                  color-psychology-20261020-practical.webp
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Add color psychology article images"
            git push
          fi
