name: Fix HealingMart Cloudflare flow WebP with ffmpeg
on:
  push:
    paths:
      - ".github/workflows/fix-hm-cloudflare-flow-ffmpeg.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build flow image
        run: |
          ffmpeg -y -f lavfi -i color=c=0xf8fafc:s=1200x675:d=1 -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='GitHub to Cloudflare - deployment flow':x=60:y=48:fontsize=42:fontcolor=0x111827,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='main push on a GitHub-hosted runner':x=60:y=105:fontsize=22:fontcolor=0x64748b,drawbox=x=55:y=220:w=190:h=180:color=0xeff6ff:t=fill,drawbox=x=55:y=220:w=190:h=180:color=0x2563eb:t=3,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='1  GIT PUSH':x=78:y=275:fontsize=25:fontcolor=0x111827,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='code / data change':x=78:y=330:fontsize=18:fontcolor=0x64748b,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='>':x=252:y=286:fontsize=42:fontcolor=0x94a3b8,drawbox=x=280:y=220:w=190:h=180:color=0xf5f3ff:t=fill,drawbox=x=280:y=220:w=190:h=180:color=0x7c3aed:t=3,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='2  ACTIONS':x=303:y=275:fontsize=25:fontcolor=0x111827,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='ubuntu-latest':x=303:y=330:fontsize=18:fontcolor=0x64748b,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='>':x=477:y=286:fontsize=42:fontcolor=0x94a3b8,drawbox=x=505:y=220:w=190:h=180:color=0xfffbeb:t=fill,drawbox=x=505:y=220:w=190:h=180:color=0xeab308:t=3,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='3  VALIDATE':x=528:y=275:fontsize=23:fontcolor=0x111827,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='build / test':x=528:y=330:fontsize=18:fontcolor=0x64748b,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='>':x=702:y=286:fontsize=42:fontcolor=0x94a3b8,drawbox=x=730:y=220:w=190:h=180:color=0xfff7ed:t=fill,drawbox=x=730:y=220:w=190:h=180:color=0xf97316:t=3,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='4  WRANGLER':x=753:y=275:fontsize=23:fontcolor=0x111827,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='wrangler deploy':x=753:y=330:fontsize=18:fontcolor=0x64748b,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='>':x=927:y=286:fontsize=42:fontcolor=0x94a3b8,drawbox=x=955:y=220:w=190:h=180:color=0xecfdf5:t=fill,drawbox=x=955:y=220:w=190:h=180:color=0x0f9f6e:t=3,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='5  CLOUDFLARE':x=978:y=267:fontsize=21:fontcolor=0x111827,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='WORKER':x=978:y=303:fontsize=21:fontcolor=0x111827,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='new deployment':x=978:y=350:fontsize=17:fontcolor=0x64748b,drawbox=x=60:y=500:w=1080:h=100:color=0xeef6ff:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='WHY YOUR PC CAN BE OFF':x=88:y=530:fontsize=23:fontcolor=0x1d4ed8,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='The GitHub-hosted runner executes the job. A self-hosted runner must stay online.':x=88:y=570:fontsize=19:fontcolor=0x334155" -frames:v 1 -c:v libwebp -quality 82 github-actions-cloudflare-worker-auto-deploy-flow.webp
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-actions-cloudflare-worker-auto-deploy-flow.webp
          git diff --cached --quiet && exit 0
          git commit -m "Fix Cloudflare article flow image"
          git push
