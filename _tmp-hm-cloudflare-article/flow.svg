<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="white"/><text x="60" y="82" font-family="Noto Sans KR, sans-serif" font-size="42" font-weight="800" fill="#111827">GitHub에서 Cloudflare까지, 실제 실행 흐름</text><text x="60" y="120" font-family="Noto Sans KR, sans-serif" font-size="22" fill="#64748b">main 브랜치 push를 예로 든 GitHub-hosted runner 흐름</text><g font-family="Noto Sans KR, sans-serif">
