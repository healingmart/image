<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f9fc"/><text x="60" y="82" font-family="Noto Sans KR, sans-serif" font-size="42" font-weight="800" fill="#111827">Cloudflare 자동 배포, 준비는 4단계</text><text x="60" y="120" font-family="Noto Sans KR, sans-serif" font-size="22" fill="#64748b">Secrets 등록과 workflow 연결을 분리해서 보면 헷갈리지 않습니다.</text><g font-family="Noto Sans KR, sans-serif">
<rect x="60" y="175" width="255" height="245" rx="24" fill="white" stroke="#dbe4f0"/><circle cx="105" cy="220" r="27" fill="#2563eb"/><text x="105" y="229" text-anchor="middle" font-size="22" font-weight="800" fill="white">01</text><text x="90" y="282" font-size="27" font-weight="800" fill="#111827">Account ID 복사</text><text x="90" y="323" font-size="19" fill="#475569">Ctrl/Cmd + K</text><text x="90" y="354" font-size="19" fill="#475569">Copy account ID</text><text x="90" y="392" font-size="18" fill="#64748b">배포할 계정 식별값</text>
<rect x="335" y="175" width="255" height="245" rx="24" fill="white" stroke="#dbe4f0"/><circle cx="380" cy="220" r="27" fill="#f97316"/><text x="380" y="229" text-anchor="middle" font-size="22" font-weight="800" fill="white">02</text><text x="365" y="282" font-size="27" font-weight="800" fill="#111827">API Token 생성</text><text x="365" y="323" font-size="19" fill="#475569">Edit Cloudflare Workers</text><text x="365" y="354" font-size="19" fill="#475569">필요 범위만 허용</text><text x="365" y="392" font-size="18" fill="#64748b">CI/CD용 인증정보</text>
<rect x="610" y="175" width="255" height="245" rx="24" fill="white" stroke="#dbe4f0"/><circle cx="655" cy="220" r="27" fill="#7c3aed"/><text x="655" y="229" text-anchor="middle" font-size="22" font-weight="800" fill="white">03</text><text x="640" y="282" font-size="27" font-weight="800" fill="#111827">GitHub Secrets</text><text x="640" y="323" font-size="18" fill="#475569">CLOUDFLARE_ACCOUNT_ID</text><text x="640" y="354" font-size="18" fill="#475569">CLOUDFLARE_API_TOKEN</text><text x="640" y="392" font-size="18" fill="#64748b">코드에 직접 적지 않기</text>
<rect x="885" y="175" width="255" height="245" rx="24" fill="white" stroke="#dbe4f0"/><circle cx="930" cy="220" r="27" fill="#0f9f6e"/><text x="930" y="229" text-anchor="middle" font-size="22" font-weight="800" fill="white">04</text><text x="915" y="282" font-size="27" font-weight="800" fill="#111827">Workflow 실행</text><text x="915" y="323" font-size="19" fill="#475569">검증 / build</text><text x="915" y="354" font-size="19" fill="#475569">→ wrangler deploy</text><text x="915" y="392" font-size="18" fill="#64748b">push 시 자동 실행</text>
<rect x="60" y="474" width="1080" height="118" rx="22" fill="#eef5ff" stroke="#bfd6ff"/><text x="90" y="520" font-size="25" font-weight="800" fill="#1d4ed8">중요</text><text x="165" y="520" font-size="23" font-weight="700" fill="#111827">Secrets 두 개만 넣어서는 자동 배포가 시작되지 않습니다.</text><text x="90" y="559" font-size="20" fill="#334155">.github/workflows 안의 GitHub Actions workflow가 이 값을 읽어 deploy를 실행해야 합니다.</text></g></svg>